# ============================================================================
# Khaalis Harvest Platform - Docker Compose Configuration
# ============================================================================
# Architecture:
# - Monorepo: NestJS Backend (port 3000) + Next.js Frontend (port 3001)
# - PostgreSQL Database (port 5432 internally, 5433 externally)
# - Redis Cache (port 6379)
# - Works for both local development and Azure production
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: khaalis-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-khaalis_harvest}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    # NO host port exposure — DB is only reachable inside Docker network.
    # For local dev DB access, use docker-compose.dev.yml which adds ports.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - khaalis-network
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    # Memory optimization (set POSTGRES_COMMAND in .env for Oracle Cloud)
    # Example: postgres -c shared_buffers=256MB -c effective_cache_size=512MB -c max_connections=50
    command: ${POSTGRES_COMMAND:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-khaalis_harvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: khaalis-redis
    # NO host port exposure — Redis is only reachable inside Docker network (no auth by default).
    # For local dev Redis access, use docker-compose.dev.yml which adds ports.
    volumes:
      - redis_data:/data
    networks:
      - khaalis-network
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    # Memory optimization (set REDIS_COMMAND in .env for Oracle Cloud)
    # Example: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    command: ${REDIS_COMMAND:-redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Application Container (Backend + Frontend)
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time environment variables (needed during Docker build)
        # Next.js embeds NEXT_PUBLIC_* vars into client bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        BACKEND_URL: ${BACKEND_URL}
        # JWT_SECRET intentionally absent from build args — injected at runtime via env_file only
        NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL}
        NEXT_PUBLIC_ADMIN_WHATSAPP: ${NEXT_PUBLIC_ADMIN_WHATSAPP}
        NEXT_PUBLIC_BANK_NAME: ${NEXT_PUBLIC_BANK_NAME}
        NEXT_PUBLIC_BANK_ACCOUNT_NAME: ${NEXT_PUBLIC_BANK_ACCOUNT_NAME}
        NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${NEXT_PUBLIC_BANK_ACCOUNT_NUMBER}
        NEXT_PUBLIC_BANK_IBAN: ${NEXT_PUBLIC_BANK_IBAN}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION}
        NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY}
        NEXT_PUBLIC_DEFAULT_LANGUAGE: ${NEXT_PUBLIC_DEFAULT_LANGUAGE}
        NODE_ENV: ${NODE_ENV:-production}
    container_name: khaalis-app
    # Load all environment variables from .env file (single source of truth)
    env_file:
      - .env
    environment:
      # Override Docker-specific values (container-to-container communication)
      # These MUST be set here because they differ from .env values
      DB_HOST: postgres  # Docker service name (not localhost)
      DB_PORT: 5432       # Internal Docker port (not host port 5433)
      REDIS_HOST: redis  # Docker service name (not localhost)
      # Internal backend URL for Next.js API routes (same container)
      INTERNAL_BACKEND_URL: http://localhost:3000
      
      # Memory optimization (set NODE_OPTIONS_BACKEND/FRONTEND in .env for Azure)
      # Defaults: Higher memory for local dev, can be reduced for Azure
      # Format: MB value (e.g., 1536 = 1.5GB)
      NODE_OPTIONS_BACKEND: ${NODE_OPTIONS_BACKEND:-1536}
      NODE_OPTIONS_FRONTEND: ${NODE_OPTIONS_FRONTEND:-2048}
    volumes:
      - uploads_data:/app/uploads
    # Ports exposed internally only (Nginx handles external traffic on 80/443)
    expose:
      - "3000"  # Backend API (internal)
      - "3001"  # Frontend Web App (internal)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - khaalis-network
    restart: unless-stopped
    # Memory limits: backend (1.5GB heap) + frontend (2GB heap) + OS overhead
    mem_limit: 4g
    memswap_limit: 4g
    # Health check: verifies backend is alive (frontend depends on backend)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # Nginx Reverse Proxy with HTTPS
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: khaalis-nginx
    ports:
      - "80:80"    # HTTP (redirects to HTTPS)
      - "443:443"  # HTTPS
    volumes:
      - ./nginx/nginx-https-duckdns.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - khaalis-network
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # ==========================================================================
  # Certbot for Let's Encrypt SSL Certificates
  # ==========================================================================
  certbot:
    image: certbot/certbot
    container_name: khaalis-certbot
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# ============================================================================
# Volumes (persistent data storage)
# ============================================================================
# IMPORTANT: Volume names are fixed to ensure data persistence across deployments
# DO NOT change these volume names or make them external unless migrating data
# ============================================================================
volumes:
  postgres_data:
    # Docker-managed volume — created automatically on first deploy.
    # To migrate data from portal_postgres_data, run:
    #   docker volume create khaalis-harvest_postgres_data
    #   docker run --rm -v portal_postgres_data:/from -v khaalis-harvest_postgres_data:/to alpine sh -c "cd /from && cp -av . /to"
    driver: local
  redis_data:
    driver: local
  uploads_data:
    # Persistent storage for user-uploaded product images and files
    driver: local
  certbot-www:
    # Certbot webroot for ACME challenges
  certbot-conf:
    # Let's Encrypt certificates storage

# ============================================================================
# Networks (container-to-container communication)
# ============================================================================
networks:
  khaalis-network:
    driver: bridge
    # All containers communicate via this network
    # Use service names (postgres, redis) as hostnames
