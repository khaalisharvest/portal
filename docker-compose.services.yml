# ============================================================================
# Khaalis Harvest — LOCAL DEV SERVICES ONLY
# Runs Postgres + Redis in Docker so you can connect from native Node.js.
# App (backend + frontend) runs natively for instant hot reload.
#
# Usage:
#   yarn services:up    — start postgres + redis
#   yarn services:down  — stop them
#
# Then in a separate terminal:
#   yarn dev:local      — starts backend (port 3000) + frontend (port 3001)
# ============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: khaalis-postgres-dev
    environment:
      POSTGRES_DB: khaalis_harvest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"     # host:5434 → container:5432  (5433 conflicts with other projects)
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khaalis_harvest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: khaalis-redis-dev
    ports:
      - "6379:6379"     # host:6379 → container:6379  (matches .env REDIS_PORT=6379)
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
  redis_dev_data:
